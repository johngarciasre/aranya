apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-aranya
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    name: in-cluster
    namespace: hello-aranya
  source:
    repoURL: https://github.com/REPLACE_ME/aranya.git
    targetRevision: REPLACE_WITH_COMMIT_SHA
    path: manifests/nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
