apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-aranya
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    name: in-cluster
    namespace: hello-aranya
  source:
    repoURL: https://github.com/johngarciasre/aranya.git
    targetRevision: 153915629b15f772ea88ada63556c148768d22d0
    path: manifests/nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
